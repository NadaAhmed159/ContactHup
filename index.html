<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ContactHub - Smart Contact Manager</title>
    <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/all.min.css" />
    <link rel="stylesheet" href="./css/bootstrap.min.css" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/query.css" />
  </head>
  <body class="bg-body-tertiary">
    <!-- ^ start nav -->
    <nav
      class="navbar navbar-expand-lg border-1 border-bottom border-body-tertiary fixed-top"
    >
      <div class="container">
        <div class="navbar-brand d-flex align-items-center gap-2">
          <span class="logo d-flex align-items-center justify-content-center">
            <i class="fa-solid fa-address-book text-white"></i>
          </span>
          <div>
            <h1 class="fw-bold h3 m-0">Contact<span>Hub</span></h1>
            <p class="m-0">Smart Contact Manager</p>
          </div>
        </div>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-2">
            <button
              class="text-white border-0 px-3 py-2"
              data-bs-toggle="modal"
              data-bs-target="#staticBackdrop"
            >
              <span>
                <i class="fa-solid fa-plus"></i>
              </span>
              Add Contact
            </button>
            <li
              class="nav-item d-flex justify-content-center align-items-center"
            >
              <span>
                <i class="fa-solid fa-bell"></i>
              </span>
            </li>
            <li
              class="nav-item d-flex justify-content-center align-items-center"
            >
              <span>
                <i class="fa-solid fa-gear"></i>
              </span>
            </li>
            <li class="nav-item">
              <img
                src="./images/avatar-4.jpg"
                class="w-100 rounded-3"
                alt="profile photo"
              />
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- ^ end nav -->

    <!--^ ========== Start model ========== -->
    <div
      class="modal fade"
      id="staticBackdrop"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
      aria-labelledby="staticBackdropLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header p-4">
            <h1 class="modal-title fs-5" id="staticBackdropLabel">
              Add New Contact
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body p-4">
            <div class="contact-form">
              <form>
                <div class="mb-3">
                  <input class="form-control" type="file" id="contactImage" />
                </div>
                <div class="mb-3">
                  <label for="fullName" class="col-form-label"
                    >Full Name <span>*</span>
                  </label>
                  <div>
                    <input
                      type="text"
                      class="form-control"
                      placeholder="Enter Full name"
                      id="fullName"
                    />
                  </div>
                </div>
                <div class="mb-3">
                  <label for="phoneNumber" class="col-form-label"
                    >Phone Number <span>*</span>
                  </label>
                  <div>
                    <input
                      type="tel"
                      placeholder="e.g., 01020917104"
                      class="form-control"
                      id="phoneNumber"
                    />
                  </div>
                </div>
                <div class="mb-3">
                  <label for="emailAddress" class="col-form-label"
                    >Email Address</label
                  >
                  <div>
                    <input
                      type="email"
                      placeholder="name@example.com"
                      class="form-control"
                      id="emailAddress"
                    />
                  </div>
                </div>
                <div class="mb-3">
                  <label for="address" class="col-form-label">Address</label>
                  <div>
                    <input
                      type="text"
                      placeholder="Enter address"
                      class="form-control"
                      id="address"
                    />
                  </div>
                </div>
                <div class="mb-3">
                  <label for="group">group</label>
                  <select
                    class="form-select"
                    id="group"
                    aria-label="select group"
                  >
                    <option selected>Select a group</option>
                    <option value="family">Family</option>
                    <option value="friends">Friends</option>
                    <option value="work">Work</option>
                    <option value="school">School</option>
                    <option value="other">Other</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label for="notes" class="col-form-label">Notes</label>
                  <div>
                    <textarea
                      class="form-control"
                      placeholder="Add notes for this contact"
                      id="notes"
                    ></textarea>
                  </div>
                </div>
                <div class="mb-3">
                  <div class="d-flex gap-3">
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="favorite"
                      />
                      <label class="form-check-label" for="favorite">
                        Favorite
                      </label>
                    </div>
                    <div class="form-check">
                      <input
                        class="form-check-input"
                        type="checkbox"
                        id="emergency"
                      />
                      <label class="form-check-label" for="emergency">
                        Emergency
                      </label>
                    </div>
                  </div>
                </div>
              </form>
              <button class="btn btn-primary" data-bs-dismiss="modal">
                Cancel
              </button>
              <button
                class="btn btn-primary"
                onclick="addContact()"
                data-bs-dismiss="modal"
              >
                Save Contact
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!--^ ========== End model ========== -->

    <section class="stats pt-5 mt-5">
      <div class="container pt-4 pb-3">
        <div class="row g-4">
          <div class="col-4">
            <div class="item d-flex align-items-center bg-white p-3 gap-3">
              <span
                class="stat total text-white d-flex align-items-center justify-content-center"
                ><i class="fa-solid fa-users"></i
              ></span>
              <div>
                <p class="m-0 text-uppercase">Total</p>
                <span class="fw-bold fs-4" id="totalCount">0 </span>
              </div>
            </div>
          </div>
          <div class="col-4">
            <div class="item d-flex align-items-center bg-white p-3 gap-3">
              <span
                class="stat favorites text-white d-flex align-items-center justify-content-center"
                ><i class="fa-solid fa-star"></i
              ></span>
              <div>
                <p class="m-0 text-uppercase">Favorites</p>
                <span class="fw-bold fs-4" id="favoritesCount">0 </span>
              </div>
            </div>
          </div>
          <div class="col-4">
            <div class="item d-flex align-items-center bg-white p-3 gap-3">
              <span
                class="stat emergency text-white d-flex align-items-center justify-content-center"
                ><i class="fa-solid fa-heart-pulse"></i
              ></span>
              <div>
                <p class="m-0 text-uppercase">Emergency</p>
                <span class="fw-bold fs-4" id="emergencyCount">0 </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="contacts  pb-5">
      <div class="container">
        <div class="row align-items-start">
          <div class="col-8">
            <div class="head">
              <h2 class="fw-bold">All Contacts</h2>
              <p>Manage and organize your  <span id="counts"class="p-0"></span>
                  contacts</p>
            </div>
            <div class="input mb-3 position-relative">
              <i
                class="fa-solid fa-magnifying-glass position-absolute translate-middle-y"
              ></i>
              <input
                type="email"
                class="form-control"
                id="search"
                placeholder="search by name, phone, or email..."
                oninput="searchContacts(this)"
              />
            </div>

            <div class="row g-4" id="contacts"></div>
          </div>
          <div class="box col-4 position-sticky">
            <div class="favorites bg-white mb-4 d-flex flex-column">
              <div class="head d-flex align-items-center gap-2">
                <span
                  class="text-white d-flex justify-content-center align-items-center"
                >
                  <i class="fas fa-star"></i>
                </span>
                <div>
                  <h2 class="fs-6 m-0">Favorites</h2>
                  <p class="m-0">Quick access to starred contacts</p>
                </div>
              </div>
              <div
                id="favoritesContacts"
                class="items position-relative flex-grow-1"
              ></div>
            </div>
            <div class="emergncy bg-white d-flex flex-column">
              <div class="head d-flex align-items-center gap-2">
                <span
                  class="text-white d-flex justify-content-center align-items-center"
                >
                  <i class="fa-solid fa-heart-pulse"></i>
                </span>
                <div>
                  <h2 class="fs-6 m-0">Emergency</h2>
                  <p class="m-0">Important contacts for urgent calls</p>
                </div>
              </div>
              <div
                id="emergenciesContacts"
                class="items position-relative flex-grow-1"
              ></div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./js/bootstrap.bundle.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
